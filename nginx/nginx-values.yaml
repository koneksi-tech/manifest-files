# NGINX Ingress Controller (ingress-nginx) values for NHN NKS.
# Installs a public LoadBalancer for 80/443 and registers IngressClass "nginx".
#
# After install, point DNS (nhn-staging.koneksi.co.kr) to the controller Service EXTERNAL-IP.

controller:
  replicaCount: 2

  ingressClassResource:
    name: nginx
    enabled: true
    default: false

  ingressClass: nginx

  service:
    type: LoadBalancer
    ports:
      http: 80
      https: 443
    # Optional: lock down who can reach the LB
    # loadBalancerSourceRanges:
    #   - 203.0.113.0/24

  admissionWebhooks:
    enabled: true

  config:
    # NGINX2Root (CVE-2026-123007, CVE-2026-123633): HTTP/2 off. Community ingress-nginx is archived and
    # bundles an unfixed nginx, so keep this until the controller is replaced with a fixed one.
    use-http2: "false"

